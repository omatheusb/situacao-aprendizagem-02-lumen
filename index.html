<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Acesso ao sistema interno Lumen Gestão.">
    <title>Entrar | Lumen Gestão</title>

    <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="pagina-login">
    <main class="container-fluid">
        <div class="row min-vh-100">

            <!-- Lado visual: some no celular para priorizar o formulário -->
            <section class="col-lg-6 d-none d-lg-flex login-visual" aria-hidden="true">
                <picture>
                    <source type="image/webp"
                        srcset="assets/img/login-ilustracao-480.webp 480w, assets/img/login-ilustracao-960.webp 960w"
                        sizes="50vw">
                    <img src="assets/img/login-ilustracao-960.jpg"
                        srcset="assets/img/login-ilustracao-480.jpg 480w, assets/img/login-ilustracao-960.jpg 960w"
                        sizes="50vw" width="960" height="1120" alt="" class="login-visual__img">
                </picture>
                <div class="login-visual__texto">
                    <p class="eyebrow">Lumen Logística</p>
                    <h2>Todas as entregas da operação em um só lugar.</h2>
                </div>
            </section>

            <!-- Formulário de autenticação -->
            <section class="col-12 col-lg-6 d-flex align-items-center justify-content-center">
                <div class="login-card">
                    <a href="index.html" class="marca mb-4">
                        <img src="assets/img/logo.svg" alt="" width="40" height="40">
                        <span>Lumen <strong>Gestão</strong></span>
                    </a>

                    <h1 class="titulo">Entrar no sistema</h1>
                    <p class="texto-suave mb-4">Use seu e-mail corporativo para acessar o painel.</p>

                    <div id="alertaLogin" class="alerta d-none" role="alert" aria-live="assertive"></div>

                    <form id="formLogin" novalidate>
                        <div class="mb-3">
                            <label for="email" class="form-label">E-mail</label>
                            <input type="email" class="form-control campo" id="email" name="email"
                                placeholder="nome@lumen.com.br" autocomplete="username" required
                                aria-describedby="emailErro">
                            <div id="emailErro" class="invalid-feedback">Digite um e-mail válido.</div>
                        </div>

                        <div class="mb-3">
                            <div class="d-flex justify-content-between">
                                <label for="senha" class="form-label">Senha</label>
                                <a href="#" class="link-acento small">Esqueci a senha</a>
                            </div>
                            <div class="campo-senha">
                                <input type="password" class="form-control campo" id="senha" name="senha"
                                    placeholder="Mínimo de 6 caracteres" autocomplete="current-password"
                                    minlength="6" required aria-describedby="senhaErro">
                                <button type="button" class="btn-mostrar" id="mostrarSenha"
                                    aria-label="Mostrar senha" aria-pressed="false">Mostrar</button>
                                <div id="senhaErro" class="invalid-feedback">A senha precisa ter pelo menos 6 caracteres.</div>
                            </div>
                        </div>

                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" id="lembrar" name="lembrar">
                            <label class="form-check-label" for="lembrar">Manter conectado</label>
                        </div>

                        <button type="submit" class="btn btn-primario w-100">Entrar</button>
                    </form>

                    <p class="dica-acesso">
                        Acesso de demonstração: <strong>ana@lumen.com.br</strong> / <strong>lumen123</strong>
                    </p>
                </div>
            </section>

        </div>
    </main>

    <script src="assets/js/login.js"></script>
</body>

</html>
